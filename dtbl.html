<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dtbl</title>
<style>
  body {
    background: #000;
    color: #e6e8ec;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    margin: 0;
    padding: 1.25em;
  }
  .controls {
    margin-bottom: 1.25em;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5em;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    opacity: 1;
    transition: opacity 0.6s ease;
  }
  .controls.idle-hidden {
    opacity: 0;
    pointer-events: none;
  }
  input[type=number], select, button {
    box-sizing: border-box;
    height: 2.125em;
    font-family: inherit;
    font-size: 0.95rem;
    background: #000;
    border: 1px solid #333;
    color: #777;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  input[type=number]:hover, input[type=number]:focus,
  select:hover, select:focus,
  button:hover, button:focus {
    border-color: #888;
    color: #e6e8ec;
  }
  input[type=number] {
    padding: 0.375em 0.5em;
    width: 7ch;
  }
  select {
    padding: 0.375em 0.5em;
    max-width: 6.25em;
    opacity: 1;
    transition: max-width 0.15s ease, opacity 0.15s ease, padding 0.15s ease, border-color 0.15s ease, margin 0.15s ease;
  }
  .loop-label {
    display: flex;
    align-items: center;
    gap: 0.25em;
    height: 2.125em;
    padding: 0 0.5em;
    max-width: 3.75em;
    opacity: 1;
    color: #777;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
    transition: max-width 0.15s ease, opacity 0.15s ease, padding 0.15s ease, margin 0.15s ease;
  }
  .loop-label:hover {
    color: #e6e8ec;
  }
  .controls:not(:focus-within):not(:hover) select,
  .controls:not(:focus-within):not(:hover) .loop-label {
    max-width: 0;
    opacity: 0;
    padding: 0.375em 0;
    margin: 0;
    border-color: transparent;
    overflow: hidden;
  }
  .rel {
    color: #666;
    user-select: none;
  }
  button {
    padding: 0.375em 0.875em;
    cursor: pointer;
  }
  .error { color: #ff6b6b; margin: -0.625em 0 1em; white-space: pre-wrap; }
  .error:empty { display: none; }
  pre {
    font-size: 0.9rem;
    line-height: 1.45;
    white-space: pre;
    margin: 0;
    max-width: 100%;
    overflow-x: auto;
  }
</style>
</head>
<body>
<div class="controls">
  <input type="number" id="r" min="1" max="22" title="replicas (r)">
  <span class="rel">&le;</span>
  <input type="number" id="n" min="1" max="22" title="servers (n)">
  <span class="rel">&le;&nbsp;22</span>
  <select id="mode" title="new server's entries: packed or spread">
    <option value="packed">..</option>
    <option value="spread">. .</option>
  </select>
  <label class="loop-label" for="loop" title="auto-regenerate while idle">
    <input type="checkbox" id="loop" checked> loop
  </label>
  <button id="generate">dtbl</button>
</div>
<div class="error" id="error"></div>
<pre id="output"></pre>

<script>
/*
 * Port of dtbl.c (SPDX-License-Identifier: GPL-2.0-or-later)
 * Original: https://github.com/danilkipnis/misc/blob/develop/dtbl.c
 */

// Least common multiple of {1, 2, ..., k} for k = 1..22.
const lcm = [1, 2, 6, 12, 60, 60, 420, 840, 2520, 2520, 27720, 27720,
             360360, 360360, 360360, 720720, 12252240, 12252240,
             232792560, 232792560, 232792560, 232792560];
const MAX_SERVERS = lcm.length;

// Size of the table needed for r replicas over k servers.
function dtblSize(r, k) {
  if (r < 1 || k < 1 || k > MAX_SERVERS) return null; // -EINVAL
  return Math.floor(lcm[k - 1] / r);
}

// Rough memory a browser tab can burn on this feature before mobile
// devices start to jank: generous headroom under both the OOM point
// and, more importantly, the CPU cost of laying out near-megachar
// single lines of monospace text.
const MEMORY_BUDGET_BYTES = 30 * 1024 * 1024;

// Estimate bytes needed: the Uint32Array kept per level for rendering,
// plus the printed text (each level renders as k rows of up to
// dtblSize(r, k+1) chars; stored once as a JS string, once in the DOM).
function estimateBytes(r, n) {
  let typedArrayBytes = 0;
  let renderChars = 0;
  for (let k = r; k <= n; k++) {
    const sz = dtblSize(r, k);
    typedArrayBytes += sz * 4;
    const szNext = (k < n) ? dtblSize(r, k + 1) : sz;
    renderChars += k * szNext;
  }
  return typedArrayBytes + renderChars * 2;
}

/*
 * Algorithms optimized to use TypedArrays (Uint32Array/Uint8Array) for 90%+ memory savings
 */
function placePacked(newTbl, need, done, szNew, k, newBit) {
  let left = 0;
  for (let s = 0; s < k - 1; s++) left += need[s];
  while (left) {
    let progress = false;
    for (let i = 0; i < szNew && left; i++) {
      if (done[i]) continue;
      for (let s = 0; s < k - 1; s++) {
        if (!need[s] || !(newTbl[i] & (1 << s))) continue;
        newTbl[i] &= ~(1 << s);
        newTbl[i] |= newBit;
        done[i] = 1;
        need[s]--;
        left--;
        progress = true;
        break;
      }
    }
    if (!progress) break;
  }
  return left === 0;
}

function placeSpread(newTbl, need, done, szNew, k, newBit) {
  let D = 0;
  for (let s = 0; s < k - 1; s++) D += need[s];
  for (let d = 0; d < D; d++) {
    const target = Math.floor(d * szNew / D);
    let placed = false;
    for (let off = 0; off < szNew && !placed; off++) {
      const i = (target + off) % szNew;
      if (done[i]) continue;
      let best = -1;
      for (let s = 0; s < k - 1; s++) {
        if (need[s] && (newTbl[i] & (1 << s)) &&
            (best < 0 || need[s] > need[best])) best = s;
      }
      if (best < 0) continue;
      newTbl[i] &= ~(1 << best);
      newTbl[i] |= newBit;
      done[i] = 1;
      need[best]--;
      placed = true;
    }
    if (!placed) return false;
  }
  return true;
}

function genTbl(r, n, mode) {
  if (r < 1 || n < r || n > MAX_SERVERS) {
    throw new Error('gen_tbl(' + r + ', ' + n + ') failed: -EINVAL');
  }
  const tbl = new Array(n).fill(null);
  
  const initialSz = Math.floor(lcm[r - 1] / r);
  tbl[r - 1] = new Uint32Array(initialSz).fill((1 << r) - 1);

  for (let k = r + 1; k <= n; k++) {
    const idx = k - 1, prev = k - 2;
    const szNew = Math.floor(lcm[idx] / r);
    const szOld = Math.floor(lcm[prev] / r);
    const move = Math.floor(lcm[idx] / (k * (k - 1)));
    const newBit = 1 << (k - 1);

    const need = new Int32Array(k - 1).fill(move);
    const done = new Uint8Array(szNew);
    const newTbl = new Uint32Array(szNew);

    const prevTbl = tbl[prev];
    for (let i = 0; i < szNew; i++) {
      newTbl[i] = prevTbl[i % szOld];
    }

    const ok = (mode === 'spread')
      ? placeSpread(newTbl, need, done, szNew, k, newBit)
      : placePacked(newTbl, need, done, szNew, k, newBit);

    if (!ok) throw new Error('gen_tbl(' + r + ', ' + n + ') failed: -EINVAL (could not balance at k=' + k + ')');
    tbl[idx] = newTbl;
  }
  return tbl;
}

// Construct the Worker code as an inline string block
const workerCode = `
const lcm = [1, 2, 6, 12, 60, 60, 420, 840, 2520, 2520, 27720, 27720,
             360360, 360360, 360360, 720720, 12252240, 12252240,
             232792560, 232792560, 232792560, 232792560];
const MAX_SERVERS = lcm.length;

${placePacked.toString()}
${placeSpread.toString()}
${genTbl.toString()}

self.onmessage = function(e) {
  if (e.data.ping) {
    self.postMessage({ pong: true });
    return;
  }
  const { r, n, mode } = e.data;
  try {
    const tbl = genTbl(r, n, mode);
    self.postMessage({ success: true, tbl });
  } catch (error) {
    self.postMessage({ success: false, error: error.message });
  }
};
`;

let worker = null;
let workerActive = false;
let pendingRequest = null;

try {
  const blob = new Blob([workerCode], { type: 'application/javascript' });
  const workerUrl = URL.createObjectURL(blob);
  worker = new Worker(workerUrl);
  URL.revokeObjectURL(workerUrl);

  worker.postMessage({ ping: true });

  worker.onmessage = function(e) {
    if (e.data.pong) {
      workerActive = true;
    } else {
      pendingRequest = null;
      displayResult(e.data);
    }
  };

  // If the worker dies mid-request (e.g. crashes on a huge table), fall
  // back to computing the in-flight request on the main thread instead of
  // leaving displayResult() uncalled — otherwise the UI hangs on
  // "Calculating..." forever and the idle loop (which waits on
  // displayResult -> doZoomEffect) never continues.
  worker.onerror = function() {
    workerActive = false;
    if (pendingRequest) {
      const { r, n, mode } = pendingRequest;
      pendingRequest = null;
      try {
        const tbl = genTbl(r, n, mode);
        displayResult({ success: true, tbl });
      } catch (e) {
        displayResult({ success: false, error: e.message });
      }
    }
  };
} catch (e) {
  workerActive = false;
}

function displayResult(data) {
  const errorEl = document.getElementById('error');
  const outEl = document.getElementById('output');
  const r = parseInt(document.getElementById('r').value, 10);
  const n = parseInt(document.getElementById('n').value, 10);

  if (data.success) {
    const tbl = data.tbl;
    let blocks = [];
    for (let k = r; k <= n; k++) {
      blocks.push(printTbl(tbl, r, k, n));
    }
    outEl.textContent = blocks.join('\n\n');
  } else {
    errorEl.textContent = data.error;
    outEl.textContent = '';
  }
  document.getElementById('generate').textContent = 'dtbl';

  if (pendingZoomEffect) {
    pendingZoomEffect = false;
    requestAnimationFrame(() => requestAnimationFrame(doZoomEffect));
  }
}

function printTbl(tbl, r, k, n) {
  const sz = dtblSize(r, k);
  const szNext = (k < n) ? dtblSize(r, k + 1) : sz;
  const repeats = Math.floor(szNext / sz) - 1;

  let lines = [];
  for (let s = 0; s < k; s++) {
    let raw = '';
    for (let i = 0; i < sz; i++) {
      raw += (tbl[k - 1][i] & (1 << s)) ? 'x' : ' ';
    }
    const shadow = raw.replace(/x/g, '.');
    const full = raw + shadow.repeat(repeats);
    let end = full.length;
    while (end > 0 && full[end - 1] === ' ') end--;
    lines.push(full.slice(0, end));
  }
  return lines.join('\n');
}

// generate() can bail out before ever calling displayResult() (bad input,
// memory-budget guard). If that happens mid idle-cycle, pendingZoomEffect
// would stay stuck true and the self-rescheduling loop in doZoomEffect
// would never run again — so abort the cycle explicitly here instead.
function abortIdleCycle() {
  if (pendingZoomEffect) {
    pendingZoomEffect = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(onIdle, IDLE_MS);
  }
}

function generate() {
  const errorEl = document.getElementById('error');
  const outEl = document.getElementById('output');
  errorEl.textContent = '';

  const r = parseInt(document.getElementById('r').value, 10);
  const n = parseInt(document.getElementById('n').value, 10);
  const mode = document.getElementById('mode').value;

  if (!Number.isInteger(r) || !Number.isInteger(n)) {
    errorEl.textContent = 'r and n must be integers.';
    abortIdleCycle();
    return;
  }
  if (r < 1 || n < r || n > MAX_SERVERS) {
    errorEl.textContent = `alloc_dtbl(${r}, ${n}) failed: r must be >=1, n >= r, n <= ${MAX_SERVERS}`;
    abortIdleCycle();
    return;
  }

  // Memory safeguard: estimate actual bytes needed (typed arrays + rendered text)
  const estimatedBytes = estimateBytes(r, n);

  if (estimatedBytes > MEMORY_BUDGET_BYTES) {
    const estMB = (estimatedBytes / (1024 * 1024)).toFixed(1);
    const capMB = (MEMORY_BUDGET_BYTES / (1024 * 1024)).toFixed(0);
    errorEl.textContent = `Memory limit exceeded! Estimated ~${estMB} MB, budget is ${capMB} MB.\nTry a smaller server limit (n) or a larger replica factor (r).`;
    abortIdleCycle();
    return;
  }

  document.getElementById('generate').textContent = 'Calculating...';
  outEl.textContent = '';

  if (worker && workerActive) {
    pendingRequest = { r, n, mode };
    worker.postMessage({ r, n, mode });
  } else {
    setTimeout(() => {
      try {
        const tbl = genTbl(r, n, mode);
        displayResult({ success: true, tbl });
      } catch (e) {
        displayResult({ success: false, error: e.message });
      }
    }, 0);
  }
}

function updateURL() {
  const r = document.getElementById('r').value;
  const n = document.getElementById('n').value;
  const mode = document.getElementById('mode').value;

  const params = new URLSearchParams();
  params.set('r', r);
  params.set('n', n);
  if (mode === 'spread') params.set('mode', mode);

  const newURL = `${window.location.pathname}?${params.toString()}`;
  history.replaceState(null, '', newURL);
}

function loadFromURL() {
  const params = new URLSearchParams(window.location.search);
  const rParam = params.get('r');
  const nParam = params.get('n');
  const modeParam = params.get('mode');

  if (rParam) document.getElementById('r').value = parseInt(rParam, 10);
  if (nParam) document.getElementById('n').value = parseInt(nParam, 10);
  if (modeParam) document.getElementById('mode').value = modeParam;
}

function initValues() {
  // updateURL() keeps ?r=&n=&mode= synced into the address bar during normal
  // use, so a plain page refresh also carries params now. Only honor them on
  // a genuine fresh navigation (typed/pasted/shared link, or back/forward) —
  // not on a reload, where the old random-on-refresh behavior should still apply.
  const navEntry = performance.getEntriesByType('navigation')[0];
  const isReload = navEntry ? navEntry.type === 'reload' : false;
  const hasURLParams = window.location.search.length > 1;

  if (hasURLParams && !isReload) {
    loadFromURL();
  } else if (!localStorage.getItem('dtbl_seen')) {
    localStorage.setItem('dtbl_seen', '1');
    document.getElementById('r').value = 3;
    document.getElementById('n').value = 7;
  } else {
    const r0 = 1 + Math.floor(Math.random() * 4);
    const nMin = Math.max(r0 + 1, 3);
    document.getElementById('r').value = r0;
    document.getElementById('n').value = nMin + Math.floor(Math.random() * (8 - nMin + 1));
  }
}

// Setup listeners (Enter key + URL updates)
document.getElementById('generate').addEventListener('click', generate);

['r', 'n', 'mode'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('change', updateURL);
  el.addEventListener('input', updateURL);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      generate();
    }
  });
});

/*
 * Idle screensaver: if the tab sits untouched for a couple of seconds,
 * grow n (same r) each cycle, regenerate, then zoom the whole page out
 * a bit further so every table block fits vertically in the viewport.
 * Once n can't grow any more, roll a fresh random r/n and zoom back in.
 * Otherwise the zoom only ever decreases while idle; real user activity
 * always resets it instantly (see resetZoom()).
 */
const IDLE_MS = 4000;
const IDLE_MS_FIRST = 10000;
const ZOOM_OUT_MS = 3200;
const ZOOM_IN_MS = 2400;
const MAX_N_PAUSE_MS = 3000;
let idleTimer = null;
let pendingZoomEffect = false;
let zoomAnimFrame = null;
let nextIdlePause = 0;
let zoomInPending = false;
let idleLoopEnabled = true;

// Neither CSS `zoom` (doesn't render on Chrome for Android) nor
// `transform: scale()` (never reflows, so content already clipped by a
// <pre>'s overflow-x:auto stays clipped forever) work everywhere. Real
// browser zoom shrinks the effective font size and reflows around it,
// which is exactly what reveals a table's previously-scrolled-off
// columns. We replicate that directly: scale the root font-size (the
// control sizing above is expressed in em/rem/ch specifically so it
// rides along), which reflows on every engine, mobile included.
const BASE_ROOT_FONT_SIZE = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;

function resetZoom() {
  if (zoomAnimFrame !== null) {
    cancelAnimationFrame(zoomAnimFrame);
    zoomAnimFrame = null;
  }
  document.documentElement.style.fontSize = '';
}

// onComplete only fires when the animation runs to completion; if
// resetZoom() cancels it partway (real user activity), the chain — and
// with it the next scheduled onIdle — simply stops, instead of firing
// alongside a fresh interaction.
function animateZoom(from, to, duration, onComplete) {
  let startTime = null;
  function step(now) {
    if (startTime === null) startTime = now;
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const scale = from + (to - from) * eased;
    document.documentElement.style.fontSize = `${BASE_ROOT_FONT_SIZE * scale}px`;
    if (t < 1) {
      zoomAnimFrame = requestAnimationFrame(step);
    } else {
      zoomAnimFrame = null;
      if (onComplete) onComplete();
    }
  }
  zoomAnimFrame = requestAnimationFrame(step);
}

function currentZoom() {
  const size = parseFloat(getComputedStyle(document.documentElement).fontSize);
  return (Number.isFinite(size) && size > 0) ? size / BASE_ROOT_FONT_SIZE : 1;
}

// Only reached once the current zoom animation runs to completion
// (resetZoom() cancels it instead if real activity interrupts it).
function scheduleNextIdle() {
  if (idleLoopEnabled) {
    idleTimer = setTimeout(onIdle, IDLE_MS + nextIdlePause);
  }
  nextIdlePause = 0;
}

function doZoomEffect() {
  const zoomNow = currentZoom();

  if (zoomInPending) {
    zoomInPending = false;
    animateZoom(zoomNow, 1, ZOOM_IN_MS, scheduleNextIdle);
    return;
  }

  // Font-size scaling genuinely reflows the page, so scrollHeight at
  // the current (already shrunk) scale must be scaled back up to infer
  // the fully-zoomed-in (natural) height instead of remeasuring at
  // scale 1 — resetting the font-size just to measure would itself
  // look like a zoom-in every cycle.
  const naturalHeight = document.body.scrollHeight / zoomNow;
  // visualViewport reports, in the same CSS-pixel space as scrollHeight,
  // how much content is actually visible right now. window.innerHeight
  // is the full layout viewport and can be far larger — e.g. under a
  // browser-level page zoom or pinch-zoom — which made this always
  // conclude "it already fits" and never shrink further.
  const viewportHeight = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const zoomOut = Math.max(0.1, Math.min(zoomNow, (viewportHeight / naturalHeight) * 0.98));

  animateZoom(zoomNow, zoomOut, ZOOM_OUT_MS, scheduleNextIdle);
}

// Whether n can still grow by one more without blowing the memory budget
// (or running past the table's own server-count ceiling).
const MAX_N = 12;

function canGrowN(r, n) {
  return n <= MAX_N && estimateBytes(r, n) <= MEMORY_BUDGET_BYTES;
}

function onIdle() {
  if (document.visibilityState !== 'visible' || !idleLoopEnabled) return;

  document.querySelector('.controls').classList.add('idle-hidden');

  const rEl = document.getElementById('r');
  const nEl = document.getElementById('n');
  const r = parseInt(rEl.value, 10);
  const n = parseInt(nEl.value, 10);

  if (Number.isInteger(n) && canGrowN(r, n + 1)) {
    nEl.value = n + 1;
    // Linger a bit once n hits its max before rolling a fresh r/n.
    nextIdlePause = canGrowN(r, n + 2) ? 0 : MAX_N_PAUSE_MS;
    zoomInPending = false;
  } else {
    const r0 = 1 + Math.floor(Math.random() * 5);
    const n0 = r0 + Math.floor(Math.random() * 4);
    rEl.value = r0;
    nEl.value = n0;
    const modeEl = document.getElementById('mode');
    modeEl.value = modeEl.value === 'spread' ? 'packed' : 'spread';
    nextIdlePause = 0;
    // A fresh r was just rolled — zoom back in instead of further out.
    zoomInPending = true;
  }

  updateURL();

  pendingZoomEffect = true;
  generate();
}

function onActivity() {
  resetZoom();
  document.querySelector('.controls').classList.remove('idle-hidden');
  clearTimeout(idleTimer);
  if (idleLoopEnabled) {
    idleTimer = setTimeout(onIdle, IDLE_MS_FIRST);
  }
}

['mousemove', 'mousedown', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(evt =>
  document.addEventListener(evt, onActivity, { passive: true }));

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    onActivity();
  } else {
    clearTimeout(idleTimer);
  }
});

document.getElementById('loop').addEventListener('change', e => {
  idleLoopEnabled = e.target.checked;
  if (idleLoopEnabled) {
    onActivity();
  } else {
    clearTimeout(idleTimer);
    resetZoom();
    document.querySelector('.controls').classList.remove('idle-hidden');
  }
});

initValues();
updateURL();
generate();  // initial generation
onActivity(); // start the idle timer
</script>
</body>
</html>
