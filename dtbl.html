<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dtbl</title>
<style>
  body {
    background: #000;
    color: #e6e8ec;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    margin: 0;
    padding: 20px;
  }
  .controls {
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
  }
  input[type=number] {
    background: #000;
    border: 1px solid #444;
    color: #e6e8ec;
    padding: 6px 8px;
    width: 4ch;
    font-family: inherit;
    font-size: 0.95rem;
    margin-right: 8px;
  }
  select {
    background: #000;
    border: 1px solid #444;
    color: #e6e8ec;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 0.95rem;
    margin-right: 8px;
  }
  .rel {
    color: #666;
    margin-right: 8px;
    font-size: 0.95rem;
    user-select: none;
    white-space: nowrap;
  }
  button {
    background: #000;
    border: 1px solid #444;
    color: #e6e8ec;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { border-color: #888; }
  .error { color: #ff6b6b; margin: -10px 0 16px; white-space: pre-wrap; }
  .error:empty { display: none; }
  pre {
    font-size: 0.9rem;
    line-height: 1.45;
    white-space: pre;
    margin: 0;
  }
</style>
</head>
<body>
<div class="controls">
  <input type="number" id="r" min="1" max="22" title="replicas (r)">
  <span class="rel">&le;</span>
  <input type="number" id="n" min="1" max="22" title="servers (n)">
  <span class="rel">&le;22</span>
  <select id="mode" title="new server's entries: packed or spread">
    <option value="packed">..</option>
    <option value="spread">. .</option>
  </select>
  <button id="generate">dtbl</button>
</div>
<div class="error" id="error"></div>
<pre id="output"></pre>

<script>
/*
 * Port of dtbl.c (SPDX-License-Identifier: GPL-2.0-or-later)
 * Original: https://github.com/danilkipnis/misc/blob/develop/dtbl.c
 */

// Least common multiple of {1, 2, ..., k} for k = 1..22.
const lcm = [1, 2, 6, 12, 60, 60, 420, 840, 2520, 2520, 27720, 27720,
             360360, 360360, 360360, 720720, 12252240, 12252240,
             232792560, 232792560, 232792560, 232792560];
const MAX_SERVERS = lcm.length;

// Size of the table needed for r replicas over k servers.
function dtblSize(r, k) {
  if (r < 1 || k < 1 || k > MAX_SERVERS) return null; // -EINVAL
  return Math.floor(lcm[k - 1] / r);
}

/*
 * Donation placement, "packed" (original dtbl.c behavior):
 * sweep entries left to right, take one donation per entry from the
 * first still-owing server holding it, until all quotas are paid.
 * The new server's entries end up as a contiguous run at the start.
 */
function placePacked(newTbl, need, done, szNew, k, newBit) {
  let left = 0;
  for (const q of need) left += q;
  while (left) {
    let progress = false;
    for (let i = 0; i < szNew && left; i++) {
      if (done[i]) continue;
      for (let s = 0; s < k - 1; s++) {
        if (!need[s] || !(newTbl[i] & (1 << s))) continue;
        newTbl[i] &= ~(1 << s);
        newTbl[i] |= newBit;
        done[i] = 1;
        need[s]--;
        left--;
        progress = true;
        break;
      }
    }
    if (!progress) break; // bail instead of spinning forever
  }
  return left === 0;
}

/*
 * Donation placement, "spread": the d-th of D donations targets entry
 * floor(d*szNew/D), i.e. donations land uniformly across the table
 * instead of piling up at the start. If a target is ineligible, probe
 * forward (wrapping). At each spot the eligible server with the largest
 * remaining debt pays, keeping per-server donations interleaved too.
 */
function placeSpread(newTbl, need, done, szNew, k, newBit) {
  let D = 0;
  for (const q of need) D += q;
  for (let d = 0; d < D; d++) {
    const target = Math.floor(d * szNew / D);
    let placed = false;
    for (let off = 0; off < szNew && !placed; off++) {
      const i = (target + off) % szNew;
      if (done[i]) continue;
      let best = -1;
      for (let s = 0; s < k - 1; s++) {
        if (need[s] && (newTbl[i] & (1 << s)) &&
            (best < 0 || need[s] > need[best])) best = s;
      }
      if (best < 0) continue;
      newTbl[i] &= ~(1 << best);
      newTbl[i] |= newBit;
      done[i] = 1;
      need[best]--;
      placed = true;
    }
    if (!placed) return false;
  }
  return true;
}

/*
 * Generate distribution tables for r replicas over r, r+1, ..., n servers.
 * Returns an array `tbl` of length n (0-based), where tbl[k-1] is the table
 * for k servers: an Int array of dtblSize(r, k) bitmaps.
 *
 * Growing the cluster from k-1 to k servers only ever moves entries onto
 * the newly added server, never reshuffling data between servers that
 * were already in the pool. `mode` picks where the moved entries land:
 * 'packed' (contiguous run, as in dtbl.c) or 'spread' (uniform).
 */
function genTbl(r, n, mode) {
  if (r < 1 || n < r || n > MAX_SERVERS) {
    throw new Error(`gen_tbl(${r}, ${n}) failed: -EINVAL`);
  }

  const tbl = new Array(n).fill(null);

  // base case: with exactly r servers, every server holds every block.
  tbl[r - 1] = new Array(Math.floor(lcm[r - 1] / r)).fill((1 << r) - 1);

  // grow the cluster one server at a time
  for (let k = r + 1; k <= n; k++) {
    const idx = k - 1, prev = k - 2;
    const szNew = Math.floor(lcm[idx] / r);
    const szOld = Math.floor(lcm[prev] / r);
    const move = Math.floor(lcm[idx] / (k * (k - 1)));
    const newBit = 1 << (k - 1);

    const need = new Array(k - 1).fill(move);
    const done = new Array(szNew).fill(0);
    const newTbl = new Array(szNew);

    // tile the previous, already-balanced table
    for (let i = 0; i < szNew; i++) newTbl[i] = tbl[prev][i % szOld];

    const ok = (mode === 'spread')
      ? placeSpread(newTbl, need, done, szNew, k, newBit)
      : placePacked(newTbl, need, done, szNew, k, newBit);

    if (!ok) throw new Error(`gen_tbl(${r}, ${n}) failed: -EINVAL (could not balance at k=${k})`);
    tbl[idx] = newTbl;
  }

  return tbl;
}

/*
 * Render the table for k servers the way dtbl.md does:
 *
 * Each row is printed raw at its own size sz = dtbl_size(r, k). Then,
 * to show that the pattern conceptually repeats to the right (blocks
 * are looked up mod sz), the pattern is echoed with 'x' replaced by '.'
 * enough times to reach the width of the next table, dtbl_size(r, k+1).
 * When the next size equals the current one (lcm doesn't grow), or for
 * the last table, no dots are appended.
 */
function printTbl(tbl, r, k, n) {
  const sz = dtblSize(r, k);
  const szNext = (k < n) ? dtblSize(r, k + 1) : sz;
  const repeats = Math.floor(szNext / sz) - 1;

  let lines = [];
  for (let s = 0; s < k; s++) {
    let raw = '';
    for (let i = 0; i < sz; i++) {
      raw += (tbl[k - 1][i] & (1 << s)) ? 'x' : ' ';
    }
    const shadow = raw.replace(/x/g, '.');
    lines.push((raw + shadow.repeat(repeats)).replace(/\s+$/, ''));
  }
  return lines.join('\n');
}

function generate() {
  const errorEl = document.getElementById('error');
  const outEl = document.getElementById('output');
  errorEl.textContent = '';

  const r = parseInt(document.getElementById('r').value, 10);
  const n = parseInt(document.getElementById('n').value, 10);
  const mode = document.getElementById('mode').value;

  if (!Number.isInteger(r) || !Number.isInteger(n)) {
    errorEl.textContent = 'r and n must be integers.';
    return;
  }
  if (r < 1 || n < r || n > MAX_SERVERS) {
    errorEl.textContent = `alloc_dtbl(${r}, ${n}) failed: r must be >=1, n >= r, n <= ${MAX_SERVERS}`;
    return;
  }
  if (dtblSize(r, n) > 2000000) {
    errorEl.textContent = `dtbl_size(${r}, ${n}) = ${dtblSize(r, n)} entries — too large to render in-browser. Try a smaller n or a larger r.`;
    return;
  }

  try {
    const tbl = genTbl(r, n, mode);
    let blocks = [];
    for (let k = r; k <= n; k++) {
      blocks.push(printTbl(tbl, r, k, n));
    }
    outEl.textContent = blocks.join('\n\n');
  } catch (e) {
    errorEl.textContent = e.message;
    outEl.textContent = '';
  }
}

document.getElementById('generate').addEventListener('click', generate);

// first ever visit (per browser): 3 7; every later load: random
if (!localStorage.getItem('dtbl_seen')) {
  localStorage.setItem('dtbl_seen', '1');
  document.getElementById('r').value = 3;
  document.getElementById('n').value = 7;
} else {
  const r0 = 1 + Math.floor(Math.random() * 4);
  const nMin = Math.max(r0 + 1, 3);
  document.getElementById('r').value = r0;
  document.getElementById('n').value = nMin + Math.floor(Math.random() * (8 - nMin + 1));
}
generate();
</script>
</body>
</html>
