<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dtbl</title>
<style>
  body {
    background: #000;
    color: #e6e8ec;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    margin: 0;
    padding: 20px;
  }
  .controls {
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  input[type=number], select, button {
    box-sizing: border-box;
    height: 34px;
    font-family: inherit;
    font-size: 0.95rem;
    background: #000;
    border: 1px solid #444;
    color: #e6e8ec;
  }
  input[type=number] {
    padding: 6px 8px;
    width: 6ch;
  }
  select {
    padding: 6px 8px;
    max-width: 100px;
    opacity: 1;
    transition: max-width 0.15s ease, opacity 0.15s ease, padding 0.15s ease, border-color 0.15s ease, margin 0.15s ease;
  }
  .controls:not(:focus-within):not(:hover) select {
    max-width: 0;
    opacity: 0;
    padding: 6px 0;
    margin: 0;
    border-color: transparent;
    overflow: hidden;
  }
  .rel {
    color: #666;
    user-select: none;
  }
  button {
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { border-color: #888; }
  .error { color: #ff6b6b; margin: -10px 0 16px; white-space: pre-wrap; }
  .error:empty { display: none; }
  pre {
    font-size: 0.9rem;
    line-height: 1.45;
    white-space: pre;
    margin: 0;
  }
</style>
</head>
<body>
<div class="controls">
  <input type="number" id="r" min="1" max="22" title="replicas (r)">
  <span class="rel">&le;</span>
  <input type="number" id="n" min="1" max="22" title="servers (n)">
  <span class="rel">&le;22</span>
  <select id="mode" title="new server's entries: packed or spread">
    <option value="packed">..</option>
    <option value="spread">. .</option>
  </select>
  <button id="generate">dtbl</button>
</div>
<div class="error" id="error"></div>
<pre id="output"></pre>

<script>
/*
 * Port of dtbl.c (SPDX-License-Identifier: GPL-2.0-or-later)
 * Original: https://github.com/danilkipnis/misc/blob/develop/dtbl.c
 */

// Least common multiple of {1, 2, ..., k} for k = 1..22.
const lcm = [1, 2, 6, 12, 60, 60, 420, 840, 2520, 2520, 27720, 27720,
             360360, 360360, 360360, 720720, 12252240, 12252240,
             232792560, 232792560, 232792560, 232792560];
const MAX_SERVERS = lcm.length;

// Size of the table needed for r replicas over k servers.
function dtblSize(r, k) {
  if (r < 1 || k < 1 || k > MAX_SERVERS) return null; // -EINVAL
  return Math.floor(lcm[k - 1] / r);
}

// Rough memory a browser tab can burn on this feature before mobile
// devices start to jank: generous headroom under both the OOM point
// and, more importantly, the CPU cost of laying out near-megachar
// single lines of monospace text.
const MEMORY_BUDGET_BYTES = 30 * 1024 * 1024;

// Estimate bytes needed: the Uint32Array kept per level for rendering,
// plus the printed text (each level renders as k rows of up to
// dtblSize(r, k+1) chars; stored once as a JS string, once in the DOM).
function estimateBytes(r, n) {
  let typedArrayBytes = 0;
  let renderChars = 0;
  for (let k = r; k <= n; k++) {
    const sz = dtblSize(r, k);
    typedArrayBytes += sz * 4;
    const szNext = (k < n) ? dtblSize(r, k + 1) : sz;
    renderChars += k * szNext;
  }
  return typedArrayBytes + renderChars * 2;
}

/*
 * Algorithms optimized to use TypedArrays (Uint32Array/Uint8Array) for 90%+ memory savings
 */
function placePacked(newTbl, need, done, szNew, k, newBit) {
  let left = 0;
  for (let s = 0; s < k - 1; s++) left += need[s];
  while (left) {
    let progress = false;
    for (let i = 0; i < szNew && left; i++) {
      if (done[i]) continue;
      for (let s = 0; s < k - 1; s++) {
        if (!need[s] || !(newTbl[i] & (1 << s))) continue;
        newTbl[i] &= ~(1 << s);
        newTbl[i] |= newBit;
        done[i] = 1;
        need[s]--;
        left--;
        progress = true;
        break;
      }
    }
    if (!progress) break;
  }
  return left === 0;
}

function placeSpread(newTbl, need, done, szNew, k, newBit) {
  let D = 0;
  for (let s = 0; s < k - 1; s++) D += need[s];
  for (let d = 0; d < D; d++) {
    const target = Math.floor(d * szNew / D);
    let placed = false;
    for (let off = 0; off < szNew && !placed; off++) {
      const i = (target + off) % szNew;
      if (done[i]) continue;
      let best = -1;
      for (let s = 0; s < k - 1; s++) {
        if (need[s] && (newTbl[i] & (1 << s)) &&
            (best < 0 || need[s] > need[best])) best = s;
      }
      if (best < 0) continue;
      newTbl[i] &= ~(1 << best);
      newTbl[i] |= newBit;
      done[i] = 1;
      need[best]--;
      placed = true;
    }
    if (!placed) return false;
  }
  return true;
}

function genTbl(r, n, mode) {
  if (r < 1 || n < r || n > MAX_SERVERS) {
    throw new Error('gen_tbl(' + r + ', ' + n + ') failed: -EINVAL');
  }
  const tbl = new Array(n).fill(null);
  
  const initialSz = Math.floor(lcm[r - 1] / r);
  tbl[r - 1] = new Uint32Array(initialSz).fill((1 << r) - 1);

  for (let k = r + 1; k <= n; k++) {
    const idx = k - 1, prev = k - 2;
    const szNew = Math.floor(lcm[idx] / r);
    const szOld = Math.floor(lcm[prev] / r);
    const move = Math.floor(lcm[idx] / (k * (k - 1)));
    const newBit = 1 << (k - 1);

    const need = new Int32Array(k - 1).fill(move);
    const done = new Uint8Array(szNew);
    const newTbl = new Uint32Array(szNew);

    const prevTbl = tbl[prev];
    for (let i = 0; i < szNew; i++) {
      newTbl[i] = prevTbl[i % szOld];
    }

    const ok = (mode === 'spread')
      ? placeSpread(newTbl, need, done, szNew, k, newBit)
      : placePacked(newTbl, need, done, szNew, k, newBit);

    if (!ok) throw new Error('gen_tbl(' + r + ', ' + n + ') failed: -EINVAL (could not balance at k=' + k + ')');
    tbl[idx] = newTbl;
  }
  return tbl;
}

// Construct the Worker code as an inline string block
const workerCode = `
const lcm = [1, 2, 6, 12, 60, 60, 420, 840, 2520, 2520, 27720, 27720,
             360360, 360360, 360360, 720720, 12252240, 12252240,
             232792560, 232792560, 232792560, 232792560];
const MAX_SERVERS = lcm.length;

${placePacked.toString()}
${placeSpread.toString()}
${genTbl.toString()}

self.onmessage = function(e) {
  if (e.data.ping) {
    self.postMessage({ pong: true });
    return;
  }
  const { r, n, mode } = e.data;
  try {
    const tbl = genTbl(r, n, mode);
    self.postMessage({ success: true, tbl });
  } catch (error) {
    self.postMessage({ success: false, error: error.message });
  }
};
`;

let worker = null;
let workerActive = false;

try {
  const blob = new Blob([workerCode], { type: 'application/javascript' });
  const workerUrl = URL.createObjectURL(blob);
  worker = new Worker(workerUrl);
  URL.revokeObjectURL(workerUrl);
  
  worker.postMessage({ ping: true });
  
  worker.onmessage = function(e) {
    if (e.data.pong) {
      workerActive = true;
    } else {
      displayResult(e.data);
    }
  };
  
  worker.onerror = function() {
    workerActive = false;
  };
} catch (e) {
  workerActive = false;
}

function displayResult(data) {
  const errorEl = document.getElementById('error');
  const outEl = document.getElementById('output');
  const r = parseInt(document.getElementById('r').value, 10);
  const n = parseInt(document.getElementById('n').value, 10);

  if (data.success) {
    const tbl = data.tbl;
    let blocks = [];
    for (let k = r; k <= n; k++) {
      blocks.push(printTbl(tbl, r, k, n));
    }
    outEl.textContent = blocks.join('\n\n');
  } else {
    errorEl.textContent = data.error;
    outEl.textContent = '';
  }
  document.getElementById('generate').textContent = 'dtbl';
}

function printTbl(tbl, r, k, n) {
  const sz = dtblSize(r, k);
  const szNext = (k < n) ? dtblSize(r, k + 1) : sz;
  const repeats = Math.floor(szNext / sz) - 1;

  let lines = [];
  for (let s = 0; s < k; s++) {
    let raw = '';
    for (let i = 0; i < sz; i++) {
      raw += (tbl[k - 1][i] & (1 << s)) ? 'x' : ' ';
    }
    const shadow = raw.replace(/x/g, '.');
    lines.push((raw + shadow.repeat(repeats)).replace(/\s+$/, ''));
  }
  return lines.join('\n');
}

function generate() {
  const errorEl = document.getElementById('error');
  const outEl = document.getElementById('output');
  errorEl.textContent = '';

  const r = parseInt(document.getElementById('r').value, 10);
  const n = parseInt(document.getElementById('n').value, 10);
  const mode = document.getElementById('mode').value;

  if (!Number.isInteger(r) || !Number.isInteger(n)) {
    errorEl.textContent = 'r and n must be integers.';
    return;
  }
  if (r < 1 || n < r || n > MAX_SERVERS) {
    errorEl.textContent = `alloc_dtbl(${r}, ${n}) failed: r must be >=1, n >= r, n <= ${MAX_SERVERS}`;
    return;
  }

  // Memory safeguard: estimate actual bytes needed (typed arrays + rendered text)
  const estimatedBytes = estimateBytes(r, n);

  if (estimatedBytes > MEMORY_BUDGET_BYTES) {
    const estMB = (estimatedBytes / (1024 * 1024)).toFixed(1);
    const capMB = (MEMORY_BUDGET_BYTES / (1024 * 1024)).toFixed(0);
    errorEl.textContent = `Memory limit exceeded! Estimated ~${estMB} MB, budget is ${capMB} MB.\nTry a smaller server limit (n) or a larger replica factor (r).`;
    return;
  }

  document.getElementById('generate').textContent = 'Calculating...';
  outEl.textContent = '';

  if (worker && workerActive) {
    worker.postMessage({ r, n, mode });
  } else {
    setTimeout(() => {
      try {
        const tbl = genTbl(r, n, mode);
        displayResult({ success: true, tbl });
      } catch (e) {
        displayResult({ success: false, error: e.message });
      }
    }, 0);
  }
}

document.getElementById('generate').addEventListener('click', generate);
['r', 'n', 'mode'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      generate();
    }
  });
});
// ==================== URL PARAMS + INIT ====================

function updateURL() {
  const r = document.getElementById('r').value;
  const n = document.getElementById('n').value;
  const mode = document.getElementById('mode').value;
  
  const params = new URLSearchParams();
  params.set('r', r);
  params.set('n', n);
  if (mode === 'spread') params.set('mode', mode);
  
  const newURL = `\( {window.location.pathname}? \){params.toString()}`;
  history.replaceState(null, '', newURL);
}

function loadFromURL() {
  const params = new URLSearchParams(window.location.search);
  const rParam = params.get('r');
  const nParam = params.get('n');
  const modeParam = params.get('mode');
  
  if (rParam) document.getElementById('r').value = parseInt(rParam, 10);
  if (nParam) document.getElementById('n').value = parseInt(nParam, 10);
  if (modeParam) document.getElementById('mode').value = modeParam;
}

function initValues() {
  const hasURLParams = window.location.search.length > 1;
  
  if (hasURLParams) {
    loadFromURL();
  } else if (!localStorage.getItem('dtbl_seen')) {
    localStorage.setItem('dtbl_seen', '1');
    document.getElementById('r').value = 3;
    document.getElementById('n').value = 7;
  } else {
    const r0 = 1 + Math.floor(Math.random() * 4);
    const nMin = Math.max(r0 + 1, 3);
    document.getElementById('r').value = r0;
    document.getElementById('n').value = nMin + Math.floor(Math.random() * (8 - nMin + 1));
  }
}

// Setup listeners (Enter key + URL updates)
document.getElementById('generate').addEventListener('click', generate);

['r', 'n', 'mode'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('change', updateURL);
  el.addEventListener('input', updateURL);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      generate();
    }
  });
});

initValues();
generate();  // initial generation
</script>
</body>
</html>
